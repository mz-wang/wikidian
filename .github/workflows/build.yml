name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Verify theme.css matches src/
        run: uv run build.py --check

      - name: Verify manifest.json is valid
        run: python -c "import json; json.load(open('manifest.json'))"
